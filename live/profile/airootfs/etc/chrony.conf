# Set the clock from the network, so the journal and the harness's event
# window (harness/remote/events.sh) use real UTC, without ever writing the
# hardware clock: chronyd only lets the kernel copy the time to the RTC
# (11-minute mode) when rtcsync is set, and here it isn't. A Windows install
# keeps the RTC in local time; writing UTC there would shift its clock.
pool pool.ntp.org iburst
makestep 1 3
