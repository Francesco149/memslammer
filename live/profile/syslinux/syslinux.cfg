SERIAL 0 115200
UI menu.c32
MENU TITLE memslammer live
MENU CLEAR

DEFAULT memslammer
TIMEOUT 30

LABEL memslammer
MENU LABEL memslammer live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL serial
MENU LABEL memslammer live (%ARCH%, BIOS, serial console)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% console=ttyS0,115200 console=tty0
