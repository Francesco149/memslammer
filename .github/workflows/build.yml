# Builds every frontend. Runs on pushes and pull requests, and is called by
# release.yml with the version to stamp into the binaries.
name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  minimal:
    name: CLI + lite (Linux, Windows)
    # 22.04: oldest supported glibc for the GTK build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 musl-tools libgtk-3-dev zip
      - name: Version
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v=$(git describe --tags --always | sed 's/^v//')
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: make -j"$(nproc)" cli lite build/selftest VERSION="$VERSION"
      - name: Self-test (injects bit flips, checks they are caught)
        run: build/selftest
      - name: Check the CLI is static
        run: |
          file build/memslammer | tee /dev/stderr | grep -q "statically linked"
          build/memslammer --version
          ls -l build/memslammer build/memslammer-lite build/memslammer.exe build/memslammer-lite.exe
      - uses: actions/upload-artifact@v4
        with:
          name: minimal
          path: |
            build/memslammer
            build/memslammer-lite
            build/memslammer.exe
            build/memslammer-lite.exe
          if-no-files-found: error

  gui:
    name: GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: memslammer-gui
          - os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bin: memslammer-gui.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - name: Version
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v=$(git describe --tags --always | sed 's/^v//')
          echo "MS_VERSION=$v" >> "$GITHUB_ENV"
      - name: Test (FFI layout, config round trip)
        run: cargo test --release --locked --manifest-path gui/Cargo.toml
      - name: Build
        run: cargo build --release --locked --manifest-path gui/Cargo.toml
      - name: Third-party licenses
        run: |
          mkdir -p out/licenses
          cp gui/target/release/${{ matrix.bin }} out/
          python3 scripts/third_party_licenses.py ${{ matrix.target }} > out/licenses/${{ matrix.os }}.txt
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: out/
          if-no-files-found: error
