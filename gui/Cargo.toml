[package]
name = "memslammer-gui"
description = "memslammer memory stress test: desktop app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "memslammer-gui"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.9.0"
smol = "2"

[build-dependencies]
cc = "1"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
